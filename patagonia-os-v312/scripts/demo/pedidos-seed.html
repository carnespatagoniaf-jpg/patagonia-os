<script>
// Demo sin base: pedidos de ejemplo guardados en este navegador. Fechas relativas a hoy.
(function () {
  try {
    var KEY = "patagonia-demo-orders";
    if (localStorage.getItem(KEY)) return;
    function day(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    var P = { asado: ["Asado", "kg"], vacio: ["Vacío", "kg"], matambre: ["Matambre", "kg"], chorizo: ["Chorizo", "unit"], morcilla: ["Morcilla", "unit"], provoleta: ["Provoleta", "unit"], carbon: ["Carbón bolsa 4 kg", "unit"], entrana: ["Entraña", "kg"], pechito: ["Pechito de cerdo", "kg"] };
    function it(id, q, n) { return { productId: id, productName: P[id][0], unit: P[id][1], quantity: q, notes: n || null }; }
    var n = 0;
    function o(off, time, name, phone, items, extra) {
      var r = { id: "demo-" + (++n), branchId: "demo-branch", customerId: null, customerName: name, customerPhone: phone, pickupDate: day(off), pickupTime: time, notes: null, total: null, deposit: 0, status: "pendiente", createdAt: new Date(Date.now() - n * 3600000).toISOString(), items: items };
      for (var k in (extra || {})) r[k] = extra[k];
      return r;
    }
    var h = new Date().getHours();
    function at(dh, m) { var x = Math.min(23, Math.max(0, h + dh)); return String(x).padStart(2, "0") + ":" + m; }
    var list = [
      o(0, at(-2, "00"), "Roberto Díaz", "2944 551 203", [it("vacio", 2)], { status: "entregado", total: 32000 }),
      o(0, at(-1, "00"), "Marta Gómez", "2944 418 776", [it("matambre", 1.5), it("morcilla", 2)], { total: 27800, deposit: 5000 }),
      o(0, at(0, "50"), "Juan Pérez", "2944 123 456", [it("asado", 2.5, "en tiras"), it("chorizo", 6), it("morcilla", 3), it("carbon", 1)], { notes: "Lo pasa a buscar el hijo", total: 64500, deposit: 10000 }),
      o(0, at(2, "30"), "Laura Fernández", "2944 302 118", [it("vacio", 1.5), it("provoleta", 1)], { status: "listo", total: 28200, deposit: 28200 }),
      o(0, at(5, "00"), "Carlos Ruiz", null, [it("entrana", 1), it("chorizo", 4)]),
      o(1, "10:30", "Sofía Álvarez", "2944 660 019", [it("pechito", 3)], { total: 29400, deposit: 10000 }),
      o(1, null, "Club Atlético Sur", "2944 700 300", [it("asado", 12), it("chorizo", 30), it("morcilla", 15), it("carbon", 4)], { total: 280000, deposit: 100000 }),
      o(3, "11:00", "Familia Rossi", null, [it("asado", 4), it("chorizo", 8), it("carbon", 2)]),
      o(3, "12:30", "Ana Torres", null, [it("vacio", 3), it("provoleta", 2)]),
      o(4, "10:00", "Pablo Medina", null, [it("asado", 6), it("matambre", 2), it("chorizo", 12)])
    ];
    localStorage.setItem(KEY, JSON.stringify(list));
  } catch (e) {}
})();
</script>
