# Demo de Pedidos con un link público (pedido del dueño, 01/11/2026).
# Sube un BORRADOR a Netlify: tiene su propia dirección y NUNCA se publica en patagoniasystem.com.ar.
# Corre solo en la rama de prueba de Pedidos; no usa la base de datos (modo demostración).
name: Demo de Pedidos

on:
  push:
    branches: [claude/elegant-fermat-yz0mga]
    paths:
      - ".github/workflows/demo-pedidos.yml"
      - "patagonia-os-v312/scripts/demo/**"
      - "patagonia-os-v312/apps/web/src/features/orders/**"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    defaults:
      run:
        working-directory: patagonia-os-v312
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patagonia-os-v312/package-lock.json
      - run: npm ci
      - name: Compilar la demo (sin base de datos)
        run: node scripts/demo/build-pedidos-demo.mjs
      - name: Subir borrador (no se publica)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_DIR: demo-dist
        run: |
          out="$(node scripts/deploy-netlify.mjs draft)"
          echo "$out"
          url="$(node -e 'const o=JSON.parse(process.argv[1]);console.log(o.url)' "$(echo "$out" | tail -1)")"
          echo "## Link de la demo de Pedidos" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Link de la demo::$url"
