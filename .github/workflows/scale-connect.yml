# Instalador de Windows de Patagonia Scale Connect (apps/connector).
# Arma el ejecutable (Node SEA), lo prueba, compila el instalador Inno Setup SIN FIRMAR y lo
# sube como artefacto junto con su SHA-256. No publica nada en ningún sitio.
#
# Se dispara SOLO:
#   - a mano: Actions → "Scale Connect (instalador)" → Run workflow, o
#   - con un tag scale-connect-vX.Y.Z (que tiene que coincidir con la versión de
#     apps/connector/package.json).
# No corre en cada push ni en los PR a propósito: tarda y no hace falta.
#
# Actualización automática (apps/connector/README.md, "Actualización automática"):
#   - El ejecutable lleva embebida la clave PÚBLICA de la variable SCALE_CONNECT_UPDATE_PUBKEY. Sin ella sale con la
#     actualización apagada (falla cerrada) y el build igual pasa.
#   - Con un tag, el job "publicar" firma latest.json con el secreto SCALE_CONNECT_UPDATE_KEY, sube instalador y
#     manifiesto al bucket público "scale-connect" de Supabase (SCALE_CONNECT_STORAGE_URL + secreto
#     SCALE_CONNECT_STORAGE_KEY) y crea el Release de GitHub. Sin esos secretos se saltea con un aviso.
#     NO publica la versión en la base: eso lo hace un administrador de plataforma con publicar-<versión>.sql.
#
# El repo vive un nivel arriba de la carpeta del proyecto (patagonia-os-v312).
name: Scale Connect (instalador)

on:
  workflow_dispatch:
  push:
    tags:
      - "scale-connect-v*"

permissions:
  contents: read

concurrency:
  group: scale-connect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instalador:
    name: Ejecutable + instalador (sin firmar)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: patagonia-os-v312
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS: el ejecutable se arma con el node.exe que corre el script
      # (scripts/lib/node22.mjs solo baja uno si no es 22.x).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm
          cache-dependency-path: patagonia-os-v312/package-lock.json

      - name: Versión del tag = versión del conector
        if: startsWith(github.ref, 'refs/tags/scale-connect-v')
        run: |
          $tag = "${{ github.ref_name }}".Substring("scale-connect-v".Length)
          $pkg = (Get-Content apps/connector/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { Write-Error "El tag dice $tag y apps/connector/package.json dice $pkg"; exit 1 }

      - name: Instalar dependencias
        run: npm ci

      # El conector corre los protocolos de la web, que importan @patagonia/domain compilado (dist/).
      - name: Compilar el dominio
        run: npm run build -w @patagonia/domain

      - name: Pruebas del conector
        run: npm run test -w @patagonia/connector

      - name: Tipos del conector
        run: npm run typecheck -w @patagonia/connector

      # build (esbuild) + Node SEA + firma de node.exe quitada + postject + serialport
      # + WinSW con SHA-256 fijo. Deja apps/connector/dist/PatagoniaScaleConnect/.
      - name: Armar el ejecutable
        env:
          # Clave PÚBLICA (no es secreta): va dentro del ejecutable. Vacía = actualización automática apagada.
          SCALE_CONNECT_UPDATE_PUBKEY: ${{ vars.SCALE_CONNECT_UPDATE_PUBKEY }}
        run: |
          if (-not $env:SCALE_CONNECT_UPDATE_PUBKEY) { Write-Output "::warning::Sin la variable SCALE_CONNECT_UPDATE_PUBKEY: este build sale con la actualización automática APAGADA (ver scripts/preparar-claves-actualizacion.ps1)." }
          npm run package -w @patagonia/connector

      - name: Probar el ejecutable (--version y /status)
        run: npm run smoke -w @patagonia/connector

      # Inno Setup 6.3+ (hace falta por "x64compatible"). Si la imagen ya lo trae, se usa ese;
      # si no, Chocolatey lo instala y verifica el checksum del paquete.
      - name: Instalar Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { Write-Error "No quedó ISCC.exe en $iscc"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---------------------------------------------------------------------------------
      # FIRMA: COMENTADA hasta tener certificado de firma de código.
      # Va comentada (y no con "if: false") porque GitHub baja todas las acciones de un job
      # aunque el paso no corra. Para activarla, con SSL.com eSigner + CodeSignTool:
      #   1. Cargar los secretos ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET.
      #   2. Descomentar los dos pasos de firma, fijando la acción a un commit (no a una rama).
      #   3. scale-connect.exe se firma ANTES de compilar el instalador (así lo lleva firmado);
      #      el instalador se firma después y su .sha256 se recalcula sobre el archivo firmado.
      # Sin firma, Windows SmartScreen avisa "editor desconocido" al instalar.
      # ---------------------------------------------------------------------------------
      # - name: Firmar scale-connect.exe
      #   uses: sslcom/esigner-codesign@<commit>
      #   with:
      #     command: sign
      #     username: ${{ secrets.ES_USERNAME }}
      #     password: ${{ secrets.ES_PASSWORD }}
      #     credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
      #     totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      #     file_path: ${{ github.workspace }}/patagonia-os-v312/apps/connector/dist/PatagoniaScaleConnect/scale-connect.exe
      #     override: true
      #     environment_name: PROD

      - name: Compilar el instalador (sin firmar)
        run: npm run installer -w @patagonia/connector

      # - name: Firmar el instalador
      #   uses: sslcom/esigner-codesign@<commit>
      #   with:
      #     command: sign
      #     username: ${{ secrets.ES_USERNAME }}
      #     password: ${{ secrets.ES_PASSWORD }}
      #     credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
      #     totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      #     file_path: ${{ github.workspace }}/patagonia-os-v312/apps/connector/dist/installer/PatagoniaScaleConnect-Setup-<versión>.exe
      #     override: true
      #     environment_name: PROD
      # - name: Recalcular el SHA-256 del instalador firmado
      #   run: Get-ChildItem apps/connector/dist/installer/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()) *$($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii }

      - name: Subir el instalador y su SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: PatagoniaScaleConnect-instalador-sin-firmar
          path: |
            patagonia-os-v312/apps/connector/dist/installer/PatagoniaScaleConnect-Setup-*.exe
            patagonia-os-v312/apps/connector/dist/installer/PatagoniaScaleConnect-Setup-*.exe.sha256
            patagonia-os-v312/apps/connector/dist/PatagoniaScaleConnect/build-info.json
          if-no-files-found: error
          retention-days: 30

  # Solo con un tag: firmar el manifiesto, subir al bucket público y crear el Release. Job aparte para que el permiso
  # de escribir Releases (contents: write) no lo tenga el job que corre npm ci y arma el ejecutable.
  publicar:
    name: Firmar y publicar la actualización
    needs: instalador
    if: startsWith(github.ref, 'refs/tags/scale-connect-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: patagonia-os-v312
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bajar el instalador del job anterior
        uses: actions/download-artifact@v4
        with:
          name: PatagoniaScaleConnect-instalador-sin-firmar
          path: artefacto

      # Sin npm ci: el script usa solo módulos de Node. La clave privada vive solo en la memoria de este paso.
      - name: Firmar latest.json y subir al bucket (si están los secretos)
        id: firmar
        env:
          SCALE_CONNECT_UPDATE_KEY: ${{ secrets.SCALE_CONNECT_UPDATE_KEY }}
          SCALE_CONNECT_UPDATE_PUBKEY: ${{ vars.SCALE_CONNECT_UPDATE_PUBKEY }}
          SCALE_CONNECT_STORAGE_URL: ${{ vars.SCALE_CONNECT_STORAGE_URL }}
          SCALE_CONNECT_STORAGE_KEY: ${{ secrets.SCALE_CONNECT_STORAGE_KEY }}
          SCALE_CONNECT_MIN_VERSION: ${{ vars.SCALE_CONNECT_MIN_VERSION }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#scale-connect-v}"
          exe="$(find ../artefacto -name "PatagoniaScaleConnect-Setup-${version}.exe" | head -1)"
          if [ -z "$exe" ]; then echo "::error::No está el instalador de la ${version} en el artefacto"; exit 1; fi
          node apps/connector/scripts/publish-release.mjs --file "$exe" --version "$version" | tee publicar.log
          if [ -f "$(dirname "$exe")/latest.json" ]; then
            echo "publicado=si" >> "$GITHUB_OUTPUT"
            echo "dir=$(cd "$(dirname "$exe")" && pwd)" >> "$GITHUB_OUTPUT"
          else
            echo "publicado=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Release de GitHub (instalador + manifiesto firmado)
        if: steps.firmar.outputs.publicado == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${{ steps.firmar.outputs.dir }}"
          version="${GITHUB_REF_NAME#scale-connect-v}"
          gh release create "$GITHUB_REF_NAME" \
            "$dir/PatagoniaScaleConnect-Setup-${version}.exe" \
            "$dir/PatagoniaScaleConnect-Setup-${version}.exe.sha256" \
            "$dir/latest.json" \
            "$dir/publicar-${version}.sql" \
            --title "Patagonia Scale Connect ${version}" \
            --notes "Instalador SIN firma de código. latest.json firmado con Ed25519. Para ofrecerla a las PC: correr publicar-${version}.sql como administrador de plataforma (empieza en piloto al 0 %)." \
            --verify-tag
